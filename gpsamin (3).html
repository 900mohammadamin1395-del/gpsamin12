<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>gpsamin | مسیریاب</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧭</text></svg>">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@3.6.2/dist/maplibre-gl.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap">

<style>
  :root{
    --bg:#0a0f14; --panel:#111820; --panel-2:#161f29; --line:#232e3a;
    --text:#eef3f7; --text-dim:#8ea0b0; --accent:#2bd9a3; --accent-dim:#1a8f6c;
    --danger:#ff5d5d; --radius:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; margin:0;}
  body{font-family:'Vazirmatn', sans-serif; background:var(--bg); color:var(--text); overflow:hidden; overscroll-behavior:none;}
  #map{position:absolute; inset:0;}
  .maplibregl-ctrl-attrib{background:rgba(10,15,20,0.7) !important; color:var(--text-dim) !important; font-size:10px !important;}
  .maplibregl-ctrl-attrib a{color:var(--text-dim) !important;}
  .maplibregl-ctrl-bottom-left, .maplibregl-ctrl-top-right{ display:none; }

  .modal-overlay{position:absolute; inset:0; background:rgba(5,8,11,0.85); z-index:2000; display:flex; align-items:center; justify-content:center; padding:20px;}
  .modal-card{background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:22px; max-width:360px; width:100%;}
  .modal-card h2{margin:0 0 8px; font-size:17px;}
  .modal-card p{color:var(--text-dim); font-size:13px; line-height:1.9; margin:0 0 14px;}
  .modal-card input{width:100%; background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:12px; color:var(--text); font-family:'Vazirmatn'; font-size:14px; margin-bottom:12px;}
  .modal-card button{width:100%; background:var(--accent); color:#04231a; border:none; border-radius:10px; padding:13px; font-family:'Vazirmatn'; font-weight:700; font-size:14.5px; cursor:pointer;}

  .top-wrap{position:absolute; top:0; right:0; left:0; padding:14px 14px 0; z-index:500; display:flex; flex-direction:column; gap:8px; pointer-events:none;}
  .brand-row{display:flex; align-items:center; justify-content:space-between; pointer-events:auto;}
  .brand{display:flex; align-items:center; gap:8px; font-weight:800; font-size:15px;}
  .brand .dot{width:9px; height:9px; border-radius:50%; background:var(--accent); box-shadow:0 0 10px var(--accent);}
  .gps-btn{width:40px; height:40px; border-radius:50%; background:var(--panel); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--text); cursor:pointer;}
  .gps-btn.active{color:var(--accent); border-color:var(--accent-dim);}
  .search-box{pointer-events:auto; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:10px 12px; display:flex; align-items:center; gap:10px; box-shadow:0 8px 24px rgba(0,0,0,0.35);}
  .search-box input{flex:1; background:transparent; border:none; outline:none; color:var(--text); font-family:'Vazirmatn'; font-size:14.5px;}
  .search-box input::placeholder{color:var(--text-dim);}
  .search-box svg{flex-shrink:0; color:var(--text-dim);}
  .results{pointer-events:auto; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; max-height:0; transition:max-height .25s ease;}
  .results.open{max-height:280px; overflow-y:auto;}
  .result-item{padding:11px 14px; font-size:13.5px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:2px; cursor:pointer;}
  .result-item:last-child{border-bottom:none;}
  .result-item:active{background:var(--panel-2);}
  .result-item b{font-weight:600; font-size:14px;}
  .result-item span{color:var(--text-dim); font-size:12px;}
  .manual-hint{pointer-events:auto; display:none; background:var(--panel); border:1px solid var(--accent-dim); border-radius:12px; padding:10px 14px; font-size:12.5px; color:var(--text-dim); text-align:center;}

  .sheet{position:absolute; left:0; right:0; bottom:0; background:var(--panel); border-top:1px solid var(--line); border-radius:20px 20px 0 0; padding:14px 16px calc(16px + env(safe-area-inset-bottom)); transform:translateY(100%); transition:transform .28s ease; z-index:600; box-shadow:0 -8px 30px rgba(0,0,0,0.4);}
  .sheet.open{transform:translateY(0);}
  .sheet-handle{width:36px; height:4px; background:var(--line); border-radius:3px; margin:0 auto 12px;}
  .sheet-dest{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
  .pin{width:34px; height:34px; border-radius:50%; background:rgba(43,217,163,0.15); color:var(--accent); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .sheet-dest-text b{display:block; font-size:14.5px; font-weight:600;}
  .sheet-dest-text span{color:var(--text-dim); font-size:12px;}
  .stat-row{display:flex; gap:10px; margin-bottom:14px;}
  .stat{flex:1; background:var(--panel-2); border-radius:12px; padding:10px 12px; text-align:center;}
  .stat b{display:block; font-size:18px; font-weight:800; color:var(--accent);}
  .stat span{font-size:11px; color:var(--text-dim);}
  .btn-row{display:flex; gap:10px;}
  .btn{flex:1; border:none; border-radius:12px; padding:13px; font-family:'Vazirmatn'; font-size:14.5px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px;}
  .btn-primary{background:var(--accent); color:#04231a;}
  .btn-primary:active{background:var(--accent-dim);}
  .btn-ghost{background:var(--panel-2); color:var(--text); border:1px solid var(--line); flex:0 0 46px;}

  .nav-panel{position:absolute; top:0; left:0; right:0; z-index:700; background:var(--panel); border-bottom:1px solid var(--line); padding:16px 16px 14px; display:none; box-shadow:0 8px 24px rgba(0,0,0,0.4);}
  .nav-panel.open{display:block;}
  .nav-step{display:flex; align-items:center; gap:14px;}
  .nav-icon{width:46px; height:46px; border-radius:50%; background:rgba(43,217,163,0.15); display:flex; align-items:center; justify-content:center; color:var(--accent); flex-shrink:0; font-size:20px;}
  .nav-text b{display:block; font-size:16px; font-weight:700; line-height:1.4;}
  .nav-text span{color:var(--text-dim); font-size:12.5px;}
  .nav-meta{display:flex; justify-content:space-between; align-items:center; margin-top:12px;}
  .nav-meta .left{font-size:12.5px; color:var(--text-dim);}
  .nav-meta .left b{color:var(--text); font-size:14px;}
  .end-nav{background:var(--danger); color:#fff; border:none; border-radius:10px; padding:8px 14px; font-family:'Vazirmatn'; font-weight:700; font-size:12.5px;}

  .toast{position:absolute; bottom:26px; left:50%; transform:translateX(-50%); background:var(--panel-2); border:1px solid var(--line); color:var(--text); padding:10px 18px; border-radius:30px; font-size:13px; z-index:900; opacity:0; pointer-events:none; transition:opacity .25s;}
  .toast.show{opacity:1;}
  .me-marker{width:18px; height:18px; border-radius:50%; background:var(--accent); border:3px solid #fff; box-shadow:0 0 0 6px rgba(43,217,163,0.25);}
</style>
</head>
<body>

<div id="map"></div>

<div class="modal-overlay" id="keyModal">
  <div class="modal-card">
    <h2>🔑 کلید Map.ir</h2>
    <p>برای نمایش نقشه به کلید API رایگان Map.ir نیاز داریم. اگه از پنل map.ir کلید گرفتی، همینجا وارد کن (فقط رو همین گوشی ذخیره میشه، جایی ارسال نمیشه).</p>
    <input id="apiKeyInput" placeholder="کلید API را اینجا بچسبان" autocomplete="off">
    <button id="saveKeyBtn">ذخیره و شروع</button>
  </div>
</div>

<div class="top-wrap">
  <div class="brand-row">
    <div class="brand"><span class="dot"></span> gpsamin</div>
    <div class="gps-btn" id="locateBtn" title="موقعیت من">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
    </div>
  </div>
  <div class="search-box">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="searchInput" placeholder="مقصد رو جستجو کن…" autocomplete="off">
  </div>
  <div class="results" id="results"></div>
  <div class="manual-hint" id="manualHint">برای تنظیم موقعیت‌ات، روی نقشه لمس کن 👆</div>
</div>

<div class="nav-panel" id="navPanel">
  <div class="nav-step">
    <div class="nav-icon" id="navIcon">↑</div>
    <div class="nav-text"><b id="navInstruction">در حال محاسبه مسیر…</b><span id="navStreet"></span></div>
  </div>
  <div class="nav-meta">
    <div class="left">باقی‌مانده: <b id="navRemain">--</b></div>
    <button class="end-nav" id="endNavBtn">پایان مسیریابی</button>
  </div>
</div>

<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-dest">
    <div class="pin"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.1-7-11a7 7 0 0 1 14 0c0 4.9-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg></div>
    <div class="sheet-dest-text"><b id="destName">مقصد</b><span id="destAddr"></span></div>
  </div>
  <div class="stat-row">
    <div class="stat"><b id="statDist">--</b><span>فاصله</span></div>
    <div class="stat"><b id="statTime">--</b><span>زمان تقریبی</span></div>
    <div class="stat"><b id="statEta">--</b><span>زمان رسیدن</span></div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="startNavBtn">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
      شروع مسیریابی با ماشین
    </button>
    <button class="btn btn-ghost" id="closeSheetBtn">✕</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
<script>
(function(){
  "use strict";

  var API_KEY = localStorage.getItem('gpsamin_mapir_key') || '';
  var map, meMarker, destMarker, meLatLng = null, destPoint = null;
  var routeSteps = [], stepIndex = 0, navigating = false, manualPick = false, watchId = null;

  function toast(msg, ms){
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(function(){ t.classList.remove('show'); }, ms || 2200);
  }

  var keyModal = document.getElementById('keyModal');
  function hideKeyModal(){ keyModal.style.display = 'none'; }

  document.getElementById('saveKeyBtn').addEventListener('click', function(){
    var val = document.getElementById('apiKeyInput').value.trim();
    if(!val){ toast('کلید رو وارد کن'); return; }
    API_KEY = val;
    localStorage.setItem('gpsamin_mapir_key', val);
    hideKeyModal();
    initMap();
  });

  if(!API_KEY){ keyModal.style.display = 'flex'; } else { hideKeyModal(); initMap(); }

  function mapirTransform(url){
    if(url.indexOf('map.ir') !== -1){
      return { url: url, headers: { 'x-api-key': API_KEY, 'Mapir-SDK': 'gpsamin-web' } };
    }
    return { url: url };
  }

  function initMap(){
    map = new maplibregl.Map({
      container: 'map',
      style: 'https://map.ir/vector/styles/main/mapir-style-dark.json',
      center: [51.3347, 35.7219],
      zoom: 12,
      transformRequest: mapirTransform,
      attributionControl: true
    });

    map.on('load', function(){ locateMe(false); });
    map.on('error', function(e){
      console.error(e);
      toast('مشکل در بارگذاری نقشه — کلید API رو بررسی کن', 3500);
    });

    map.on('click', function(e){
      closeResults();
      if(manualPick){
        meLatLng = [e.lngLat.lng, e.lngLat.lat];
        placeMe(meLatLng);
        manualPick = false;
        document.getElementById('manualHint').style.display = 'none';
        toast('موقعیتت تنظیم شد ✓');
        if(destPoint) fetchRoute();
      }
    });

    var pressTimer = null;
    map.on('mousedown touchstart', function(e){
      pressTimer = setTimeout(function(){
        meLatLng = [e.lngLat.lng, e.lngLat.lat];
        placeMe(meLatLng);
        manualPick = false;
        document.getElementById('manualHint').style.display = 'none';
        toast('موقعیتت به این نقطه تغییر کرد ✓');
        if(destPoint) fetchRoute();
      }, 650);
    });
    map.on('mouseup touchend touchmove dragstart', function(){ clearTimeout(pressTimer); });
  }

  function locateMe(fly){
    if(!navigator.geolocation){ enableManualPick(); return; }
    document.getElementById('locateBtn').classList.add('active');
    navigator.geolocation.getCurrentPosition(function(pos){
      meLatLng = [pos.coords.longitude, pos.coords.latitude];
      placeMe(meLatLng);
      if(fly) map.flyTo({ center: meLatLng, zoom: 16 });
      document.getElementById('manualHint').style.display = 'none';
    }, function(){
      document.getElementById('locateBtn').classList.remove('active');
      enableManualPick();
    }, { enableHighAccuracy:true, timeout:8000 });
  }

  function enableManualPick(){
    manualPick = true;
    document.getElementById('manualHint').style.display = 'block';
    toast('GPS در دسترس نیست — روی نقشه لمس کن تا موقعیتت تنظیم بشه', 3200);
  }

  function placeMe(lnglat){
    if(meMarker){ meMarker.setLngLat(lnglat); return; }
    var el = document.createElement('div');
    el.className = 'me-marker';
    meMarker = new maplibregl.Marker({ element: el }).setLngLat(lnglat).addTo(map);
  }

  document.getElementById('locateBtn').addEventListener('click', function(){ locateMe(true); });

  var searchInput = document.getElementById('searchInput');
  var resultsBox = document.getElementById('results');
  var searchTimer = null;

  searchInput.addEventListener('input', function(){
    var q = searchInput.value.trim();
    clearTimeout(searchTimer);
    if(q.length < 2){ closeResults(); return; }
    searchTimer = setTimeout(function(){ doSearch(q); }, 400);
  });

  function closeResults(){ resultsBox.classList.remove('open'); resultsBox.innerHTML=''; }

  function doSearch(q){
    var center = meLatLng || (map ? [map.getCenter().lng, map.getCenter().lat] : [51.3347, 35.7219]);
    fetch('https://map.ir/search/v2/autocomplete/', {
      method: 'POST',
      headers: { 'x-api-key': API_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: q, location: { type: 'Point', coordinates: [center[0], center[1]] } })
    }).then(function(r){ return r.json(); })
      .then(function(data){ renderResults(data.value || data.items || []); })
      .catch(function(){ toast('جستجو ناموفق بود — اتصال اینترنت رو چک کن'); });
  }

  function renderResults(list){
    resultsBox.innerHTML = '';
    if(!list.length){
      resultsBox.innerHTML = '<div class="result-item"><span>نتیجه‌ای یافت نشد</span></div>';
      resultsBox.classList.add('open');
      return;
    }
    list.forEach(function(item){
      var div = document.createElement('div');
      div.className = 'result-item';
      var title = item.title || item.address || 'بدون نام';
      var addr = item.address || '';
      div.innerHTML = '<b>' + title + '</b><span>' + addr + '</span>';
      div.addEventListener('click', function(){ selectDestination(item); });
      resultsBox.appendChild(div);
    });
    resultsBox.classList.add('open');
  }

  function selectDestination(item){
    closeResults();
    searchInput.value = item.title || item.address || '';
    searchInput.blur();
    var lat = parseFloat(item.geom ? item.geom.coordinates[1] : item.lat);
    var lon = parseFloat(item.geom ? item.geom.coordinates[0] : item.lon);
    destPoint = [lon, lat];
    if(destMarker) destMarker.setLngLat(destPoint);
    else destMarker = new maplibregl.Marker({ color: '#ff5d5d' }).setLngLat(destPoint).addTo(map);
    document.getElementById('destName').textContent = item.title || 'مقصد';
    document.getElementById('destAddr').textContent = item.address || '';
    openSheet();
    if(meLatLng){ fetchRoute(); }
    else { locateMe(false); toast('در حال یافتن موقعیت شما…'); setTimeout(function(){ if(meLatLng) fetchRoute(); }, 1500); }
    var bounds = new maplibregl.LngLatBounds(destPoint, destPoint);
    if(meLatLng) bounds.extend(meLatLng);
    map.fitBounds(bounds, { padding: 70 });
  }

  var sheet = document.getElementById('sheet');
  function openSheet(){ sheet.classList.add('open'); }
  function closeSheet(){ sheet.classList.remove('open'); }
  document.getElementById('closeSheetBtn').addEventListener('click', function(){
    closeSheet();
    clearRouteLayer();
    if(destMarker){ destMarker.remove(); destMarker = null; }
    destPoint = null;
  });

  function fetchRoute(){
    if(!meLatLng || !destPoint) return;
    var coords = meLatLng[0] + ',' + meLatLng[1] + ';' + destPoint[0] + ',' + destPoint[1];
    var url = 'https://map.ir/route/v1/driving/' + coords + '?overview=full&steps=true&alternatives=false';
    fetch(url, { headers: { 'x-api-key': API_KEY } })
      .then(function(r){ return r.json(); })
      .then(function(data){
        if(!data.routes || !data.routes.length){ toast('مسیری پیدا نشد'); return; }
        var route = data.routes[0];
        drawRoute(route);
        routeSteps = (route.legs && route.legs[0] && route.legs[0].steps) || [];
        updateStats(route);
      }).catch(function(){ toast('مسیریابی ناموفق بود — اتصال اینترنت رو چک کن'); });
  }

  function clearRouteLayer(){
    if(map.getLayer('route-line')) map.removeLayer('route-line');
    if(map.getSource('route-src')) map.removeSource('route-src');
  }

  function drawRoute(route){
    clearRouteLayer();
    map.addSource('route-src', { type: 'geojson', data: { type: 'Feature', geometry: route.geometry, properties: {} } });
    map.addLayer({
      id: 'route-line', type: 'line', source: 'route-src',
      layout: { 'line-join': 'round', 'line-cap': 'round' },
      paint: { 'line-color': '#2bd9a3', 'line-width': 6, 'line-opacity': 0.9 }
    });
  }

  function fmtDist(m){ if(m >= 1000) return (m/1000).toFixed(1) + ' کیلومتر'; return Math.round(m) + ' متر'; }
  function fmtDur(s){
    var min = Math.round(s/60);
    if(min < 60) return min + ' دقیقه';
    var h = Math.floor(min/60), r = min%60;
    return h + ' ساعت ' + (r? r + ' دقیقه':'');
  }
  function updateStats(route){
    document.getElementById('statDist').textContent = fmtDist(route.distance);
    document.getElementById('statTime').textContent = fmtDur(route.duration);
    var eta = new Date(Date.now() + route.duration*1000);
    document.getElementById('statEta').textContent = eta.toLocaleTimeString('fa-IR', {hour:'2-digit', minute:'2-digit'});
  }

  var navPanel = document.getElementById('navPanel');
  var maneuverIcons = {
    'turn-left':'↰','turn-right':'↱','turn-straight':'↑','straight':'↑',
    'turn-slight-left':'↖','turn-slight-right':'↗','turn-sharp-left':'↩','turn-sharp-right':'↪',
    'uturn':'↶','arrive':'🏁','depart':'●','merge':'⇥','roundabout':'↻','fork':'⑂','new name':'↑'
  };

  function stepText(step){
    var m = step.maneuver || {};
    var type = m.type || 'straight';
    var mod = m.modifier || '';
    var icon = maneuverIcons[type] || (mod && maneuverIcons['turn-'+mod]) || '↑';
    var road = step.name && step.name.length ? step.name : 'مسیر بدون‌نام';
    var text;
    if(type === 'depart') text = 'شروع حرکت در ' + road;
    else if(type === 'arrive') text = 'شما به مقصد رسیدید';
    else if(type === 'roundabout') text = 'وارد میدان شوید و در ' + road + ' خارج شوید';
    else {
      var dir = mod === 'left' ? 'به چپ' : mod === 'right' ? 'به راست' :
                mod === 'slight left' ? 'کمی به چپ' : mod === 'slight right' ? 'کمی به راست' :
                mod === 'sharp left' ? 'به‌شدت به چپ' : mod === 'sharp right' ? 'به‌شدت به راست' :
                mod === 'uturn' ? 'دور بزنید' : 'مستقیم بروید';
      text = (mod ? 'بپیچید ' + dir : 'مستقیم بروید') + ' در ' + road;
    }
    return { icon: icon, text: text };
  }

  function renderStep(i){
    if(i >= routeSteps.length){ finishNav(true); return; }
    var s = stepText(routeSteps[i]);
    document.getElementById('navIcon').textContent = s.icon;
    document.getElementById('navInstruction').textContent = s.text;
    document.getElementById('navStreet').textContent = fmtDist(routeSteps[i].distance) + ' بعد';
    var remainingDist = routeSteps.slice(i).reduce(function(a,st){return a+st.distance;},0);
    document.getElementById('navRemain').textContent = fmtDist(remainingDist);
  }

  document.getElementById('startNavBtn').addEventListener('click', function(){
    if(!routeSteps.length){ toast('اول یک مقصد انتخاب کن'); return; }
    navigating = true; stepIndex = 0;
    navPanel.classList.add('open');
    closeSheet();
    renderStep(0);
    if(meLatLng) map.flyTo({ center: meLatLng, zoom: 17 });
    startWatch();
    toast('مسیریابی شروع شد — به سلامت برسی 🚗');
  });

  document.getElementById('endNavBtn').addEventListener('click', function(){ finishNav(false); });

  function finishNav(arrived){
    navigating = false;
    navPanel.classList.remove('open');
    stopWatch();
    if(arrived) toast('به مقصد رسیدید 🎉', 3000);
  }

  function startWatch(){
    if(!navigator.geolocation) return;
    watchId = navigator.geolocation.watchPosition(function(pos){
      meLatLng = [pos.coords.longitude, pos.coords.latitude];
      placeMe(meLatLng);
      if(navigating){ map.panTo(meLatLng); maybeAdvanceStep(); }
    }, function(){}, { enableHighAccuracy:true, maximumAge:1000 });
  }
  function stopWatch(){ if(watchId !== null && navigator.geolocation){ navigator.geolocation.clearWatch(watchId); watchId = null; } }

  function distMeters(a,b){
    var R=6371000, dLat=(b[1]-a[1])*Math.PI/180, dLon=(b[0]-a[0])*Math.PI/180;
    var la1=a[1]*Math.PI/180, la2=b[1]*Math.PI/180;
    var h = Math.sin(dLat/2)**2 + Math.cos(la1)*Math.cos(la2)*Math.sin(dLon/2)**2;
    return 2*R*Math.asin(Math.sqrt(h));
  }

  function maybeAdvanceStep(){
    if(stepIndex >= routeSteps.length) return;
    var step = routeSteps[stepIndex];
    var loc = step.maneuver.location;
    var d = distMeters(meLatLng, loc);
    if(d < 35){ stepIndex++; renderStep(stepIndex); }
    else { document.getElementById('navStreet').textContent = fmtDist(d) + ' بعد'; }
  }
})();
</script>
</body>
</html>
